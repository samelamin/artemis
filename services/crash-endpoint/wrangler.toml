name = "crash-endpoint"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true

# account_id is intentionally omitted so wrangler falls back to the
# CLOUDFLARE_ACCOUNT_ID environment variable at deploy time. Do not add it
# here — this repository is public.

[[r2_buckets]]
binding = "REPORTS_BUCKET"
bucket_name = "vbt-reports"

# Daily budget counter. A Durable Object rather than KV so check-and-
# increment is atomic under concurrency (Wave 7 BLOCKER 2) — KV's
# eventually-consistent read-modify-write let two concurrent requests both
# pass a budget with room for only one.
[[durable_objects.bindings]]
name = "DAILY_BUDGET_DO"
class_name = "DailyBudgetCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DailyBudgetCounter"]

# Per-IP throttle. The namespace_id is a small integer that just names
# this rate limiter within the Worker; it is not a Cloudflare account
# resource id and does not need to be created ahead of time.
[[ratelimits]]
name = "REPORT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
