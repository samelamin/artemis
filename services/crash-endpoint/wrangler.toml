name = "crash-endpoint"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true

# account_id is intentionally omitted so wrangler falls back to the
# CLOUDFLARE_ACCOUNT_ID environment variable at deploy time. Do not add it
# here — this repository is public.

[[r2_buckets]]
binding = "REPORTS_BUCKET"
bucket_name = "vbt-reports"

# TODO(deploy): the KV namespace id is generated by `wrangler kv namespace
# create DAILY_BUDGET_KV`. Run that command once before the first deploy
# and replace the placeholder id below with the value it prints.
[[kv_namespaces]]
binding = "DAILY_BUDGET_KV"
id = "REPLACE_WITH_REAL_KV_NAMESPACE_ID"

# Per-IP throttle. The namespace_id is a small integer that just names
# this rate limiter within the Worker; it is not a Cloudflare account
# resource id and does not need to be created ahead of time.
[[ratelimits]]
name = "REPORT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
